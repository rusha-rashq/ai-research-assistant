<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Research Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  nav button { padding: .5rem 1rem; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
  nav button.active { background: #222; color: #fff; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
  .card h3 { margin: 0 0 .3rem; }
  .meta { color: #666; font-size: .9rem; }
  .err { color: #b00020; }
  input[type=text] { width: 70%; padding: .5rem; }
  .tag { font-size: .75rem; background: #eee; border-radius: 4px; padding: .1rem .4rem; margin-left: .4rem; }
  .warn { color: #8a5a00; }
  button.act { padding: .5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<h1>AI Research Assistant</h1>
<nav>
  <button id="tab-search" class="active">Search</button>
  <button id="tab-library">Library</button>
</nav>

<section id="search-view">
  <p>
    <input type="text" id="q" placeholder="Search arXiv by keyword...">
    <button class="act" id="search-btn">Search</button>
  </p>
  <div id="status"></div>
  <div id="results"></div>
</section>

<section id="library-view" hidden>
  <div class="card">
    <strong>Upload a PDF</strong>
    <input type="file" id="pdf-file" accept="application/pdf">
    <button class="act" id="upload-btn">Upload &amp; extract metadata</button>
    <div id="upload-status" class="meta"></div>
  </div>
  <div id="lib-status"></div>
  <div id="library"></div>
</section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let results = [];

function showTab(name) {
  $("search-view").hidden = name !== "search";
  $("library-view").hidden = name !== "library";
  $("tab-search").classList.toggle("active", name === "search");
  $("tab-library").classList.toggle("active", name === "library");
  if (name === "library") loadLibrary();
}
$("tab-search").onclick = () => showTab("search");
$("tab-library").onclick = () => showTab("library");

async function savePaper(i) {
  const btn = $("save-" + i), msg = $("save-msg-" + i);
  btn.disabled = true;
  msg.textContent = "Saving (downloading PDF)...";
  msg.className = "meta";
  try {
    const r = await fetch("/api/papers", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(results[i]),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Save failed");
    msg.textContent = data.warning ? data.warning : "Saved.";
    if (data.warning) msg.className = "warn";
  } catch (e) {
    msg.innerHTML = `<span class="err">${esc(e.message)}</span>`;
    if (!String(e.message).includes("already")) btn.disabled = false;
  }
}

async function loadLibrary() {
  $("lib-status").textContent = "Loading...";
  try {
    const r = await fetch("/api/papers");
    const papers = await r.json();
    if (!r.ok) throw new Error(papers.detail || "Failed to load library");
    $("lib-status").textContent = papers.length ? "" : "Your library is empty. Save papers from the Search tab.";
    $("library").innerHTML = papers.map(p => `
      <div class="card">
        <h3>${esc(p.title)}<span class="tag">${esc(p.source)}</span>
          ${p.has_text ? "" : '<span class="tag">no full text</span>'}</h3>
        <div class="meta">${esc(p.authors)} &middot; ${esc(p.year)}</div>
        <p>${esc(p.abstract)}</p>
        ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">View on arXiv</a>` : ""}
        <button class="act" onclick="deletePaper(${p.id})">Delete</button>
      </div>`).join("");
  } catch (e) {
    $("lib-status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

$("upload-btn").onclick = async () => {
  const f = $("pdf-file").files[0];
  if (!f) { $("upload-status").textContent = "Choose a PDF first."; return; }
  const st = $("upload-status");
  st.className = "meta";
  st.textContent = "Extracting text and asking Claude for metadata...";
  $("upload-btn").disabled = true;
  try {
    const fd = new FormData();
    fd.append("file", f);
    const r = await fetch("/api/upload", {method: "POST", body: fd});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Upload failed");
    st.textContent = "Added: " + data.paper.title;
    $("pdf-file").value = "";
    loadLibrary();
  } catch (e) {
    st.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    $("upload-btn").disabled = false;
  }
};

async function deletePaper(id) {
  if (!confirm("Delete this paper from your library?")) return;
  await fetch("/api/papers/" + id, {method: "DELETE"});
  loadLibrary();
}

async function doSearch() {
  const q = $("q").value.trim();
  if (!q) return;
  $("status").textContent = "Searching...";
  $("results").innerHTML = "";
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Search failed");
    $("status").textContent = data.length ? "" : "No results.";
    results = data;
    $("results").innerHTML = data.map((p, i) => `
      <div class="card">
        <h3>${esc(p.title)}</h3>
        <div class="meta">${esc(p.authors.join(", "))} &middot; ${esc(p.year)}</div>
        <p>${esc(p.abstract)}</p>
        <a href="${esc(p.url)}" target="_blank" rel="noopener">View on arXiv</a>
        <button class="act" id="save-${i}" onclick="savePaper(${i})">Save to library</button>
        <span id="save-msg-${i}" class="meta"></span>
      </div>`).join("");
  } catch (e) {
    $("status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}
$("search-btn").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
</script>
</body>
</html>
