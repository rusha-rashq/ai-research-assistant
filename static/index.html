<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Research Assistant</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --bg: #f3f4f6;
    --card: #fff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 1.25rem 3rem; }

  header { padding: 1.75rem 0 .5rem; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: .2rem 0 0; color: var(--muted); }

  .tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border); margin: 1rem 0 1.25rem; }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .6rem .1rem;
         font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .card { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 1rem 1.15rem; margin-bottom: 1rem; }
  .card h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: .88rem; }
  .err { color: #b91c1c; }
  .warn { color: #92600a; }
  .count { color: var(--muted); font-size: .92rem; margin: 0 0 .75rem; }

  .abstract { margin: .6rem 0 .2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract.open { display: block; }
  .toggle { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: .88rem; cursor: pointer; }

  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .6rem; }
  input[type=text], textarea { width: 100%; padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 8px;
                               font: inherit; background: #fff; }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .searchbar { display: flex; gap: .5rem; margin-bottom: .75rem; }
  button.act { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .55rem 1rem; font: inherit;
               font-weight: 600; cursor: pointer; white-space: nowrap; }
  button.act:hover { filter: brightness(1.08); }
  button.act:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  a { color: var(--accent); }

  .tag { font-size: .7rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: .1rem .55rem;
         margin-left: .4rem; font-weight: 600; vertical-align: middle; }
  .tag.gray { background: #f3f4f6; color: var(--muted); }

  .spinner { display: inline-block; width: .95em; height: .95em; border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -.15em; margin-right: .4rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Library: list on the left, detail panel on the right */
  .split { display: grid; grid-template-columns: 360px 1fr; gap: 1.25rem; align-items: start; }
  .detail { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; margin-bottom: 0; }
  .item { cursor: pointer; border: 2px solid transparent; padding: .8rem 1rem; }
  .item:hover { border-color: var(--border); }
  .item.selected { border-color: var(--accent); background: var(--accent-soft); }
  .item .title { font-weight: 600; }
  .del { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .82rem; padding: 0; }
  .del:hover { color: #b91c1c; }
  .placeholder { color: var(--muted); text-align: center; padding: 3rem 1rem; }
  .detail h2 { font-size: 1rem; margin: 1.25rem 0 .5rem; }

  .md { line-height: 1.55; }
  .md h2 { font-size: 1.05rem; margin: 1rem 0 .3rem; color: var(--accent); }
  .md pre { background: #f3f4f6; padding: .5rem; overflow-x: auto; border-radius: 6px; }
  .qa { border-left: 3px solid var(--accent); background: #fafafa; padding: .5rem .9rem; margin: .8rem 0; border-radius: 0 8px 8px 0; }
  .qa .q { font-weight: 600; }

  @media (max-width: 800px) {
    .split { grid-template-columns: 1fr; }
    .detail { position: static; max-height: none; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>AI Research Assistant</h1>
  <p>Search arXiv, build a local library, and get Claude to summarize papers or answer questions about them.</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab active" id="tab-search" role="tab">Search</button>
  <button class="tab" id="tab-library" role="tab">Library</button>
</div>

<section id="search-view">
  <div class="searchbar">
    <input type="text" id="q" placeholder="Search arXiv by keyword, e.g. retrieval augmented generation">
    <button class="act" id="search-btn">Search</button>
  </div>
  <div id="status" class="count"></div>
  <div id="results"></div>
</section>

<section id="library-view" hidden>
  <div class="split">
    <div>
      <div class="card">
        <strong>Upload a PDF</strong>
        <div class="row">
          <input type="file" id="pdf-file" accept="application/pdf">
          <button class="act" id="upload-btn">Upload</button>
        </div>
        <div id="upload-status" class="meta" style="margin-top:.5rem"></div>
      </div>
      <div id="lib-status" class="count"></div>
      <div id="library"></div>
    </div>

    <div class="card detail" id="detail">
      <div class="placeholder" id="detail-placeholder">Select a paper from the list to summarize it or ask questions.</div>
      <div id="detail-view" hidden>
        <div id="detail-meta"></div>
        <h2>Summary</h2>
        <div class="row" style="margin-top:0">
          <button class="act" id="summarize-btn">Summarize</button>
          <span id="summary-status" class="meta"></span>
        </div>
        <div id="summary" class="md"></div>
        <h2>Ask a question</h2>
        <textarea id="question" rows="3" placeholder="Ask anything about this paper... (Ctrl/Cmd+Enter to send)"></textarea>
        <div class="row">
          <button class="act" id="ask-btn">Ask</button>
          <span id="ask-status" class="meta"></span>
        </div>
        <div id="answers"></div>
      </div>
    </div>
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Render Markdown from the model; sanitize it, and fall back to plain text if the CDN scripts didn't load.
const md = text => (window.marked && window.DOMPurify)
  ? DOMPurify.sanitize(marked.parse(text))
  : `<pre style="white-space:pre-wrap">${esc(text)}</pre>`;
const spin = text => `<span class="spinner"></span>${esc(text)}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

// Abstracts are clamped to 3 lines; add a "Show more" toggle only where the text actually overflows.
const abstractHtml = text => `<div class="abstract">${esc(text)}</div><button class="toggle" hidden onclick="toggleAbstract(this)">Show more</button>`;
function toggleAbstract(btn) {
  const open = btn.previousElementSibling.classList.toggle("open");
  btn.textContent = open ? "Show less" : "Show more";
}
function initAbstracts(root) {
  root.querySelectorAll(".abstract").forEach(el => {
    el.nextElementSibling.hidden = el.scrollHeight <= el.clientHeight + 1;
  });
}

let results = [];
let currentId = null;

function showTab(name) {
  $("search-view").hidden = name !== "search";
  $("library-view").hidden = name !== "library";
  $("tab-search").classList.toggle("active", name === "search");
  $("tab-library").classList.toggle("active", name === "library");
  if (name === "library") loadLibrary();
  else initAbstracts($("results"));
}
$("tab-search").onclick = () => showTab("search");
$("tab-library").onclick = () => showTab("library");

// ---- Search ----
async function doSearch() {
  const q = $("q").value.trim();
  if (!q) return;
  $("status").innerHTML = spin("Searching arXiv...");
  $("results").innerHTML = "";
  $("search-btn").disabled = true;
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Search failed");
    results = data;
    $("status").textContent = data.length ? `${plural(data.length, "result")} for “${q}”` : `No results for “${q}”.`;
    $("results").innerHTML = data.map((p, i) => `
      <div class="card">
        <h3>${esc(p.title)}</h3>
        <div class="meta">${esc(p.authors.join(", "))} &middot; ${esc(p.year)}</div>
        ${abstractHtml(p.abstract)}
        <div class="row">
          <button class="act" id="save-${i}" onclick="savePaper(${i})">Save to library</button>
          <a href="${esc(p.url)}" target="_blank" rel="noopener">View on arXiv</a>
          <span id="save-msg-${i}" class="meta"></span>
        </div>
      </div>`).join("");
    initAbstracts($("results"));
  } catch (e) {
    $("status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    $("search-btn").disabled = false;
  }
}
$("search-btn").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

async function savePaper(i) {
  const btn = $("save-" + i), msg = $("save-msg-" + i);
  btn.disabled = true;
  msg.className = "meta";
  msg.innerHTML = spin("Saving (downloading PDF)...");
  try {
    const r = await fetch("/api/papers", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(results[i]),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Save failed");
    msg.textContent = data.warning ? data.warning : "Saved.";
    if (data.warning) msg.className = "warn";
  } catch (e) {
    msg.innerHTML = `<span class="err">${esc(e.message)}</span>`;
    if (!String(e.message).includes("already")) btn.disabled = false;
  }
}

// ---- Library ----
async function loadLibrary() {
  $("lib-status").innerHTML = spin("Loading...");
  try {
    const r = await fetch("/api/papers");
    const papers = await r.json();
    if (!r.ok) throw new Error(papers.detail || "Failed to load library");
    $("lib-status").textContent = papers.length
      ? plural(papers.length, "saved paper")
      : "Your library is empty. Save papers from the Search tab or upload a PDF.";
    $("library").innerHTML = papers.map(p => `
      <div class="card item ${p.id === currentId ? "selected" : ""}" data-id="${p.id}" onclick="openPaper(${p.id})">
        <div class="title">${esc(p.title)}</div>
        <div class="meta">${esc(p.authors)}${p.year ? " &middot; " + esc(p.year) : ""}</div>
        <div class="row">
          <span class="tag">${p.source === "upload" ? "uploaded" : "arXiv"}</span>
          ${p.has_text ? "" : '<span class="tag gray">no full text yet</span>'}
          <span style="flex:1"></span>
          <button class="del" onclick="event.stopPropagation(); deletePaper(${p.id})">Delete</button>
        </div>
      </div>`).join("");
  } catch (e) {
    $("lib-status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

$("upload-btn").onclick = async () => {
  const f = $("pdf-file").files[0];
  const st = $("upload-status");
  if (!f) { st.textContent = "Choose a PDF first."; return; }
  st.className = "meta";
  st.innerHTML = spin("Extracting text and asking Claude for metadata...");
  $("upload-btn").disabled = true;
  try {
    const fd = new FormData();
    fd.append("file", f);
    const r = await fetch("/api/upload", {method: "POST", body: fd});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Upload failed");
    st.textContent = "Added: " + data.paper.title;
    $("pdf-file").value = "";
    loadLibrary();
  } catch (e) {
    st.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    $("upload-btn").disabled = false;
  }
};

async function deletePaper(id) {
  if (!confirm("Delete this paper from your library?")) return;
  await fetch("/api/papers/" + id, {method: "DELETE"});
  if (id === currentId) {
    currentId = null;
    $("detail-view").hidden = true;
    $("detail-placeholder").hidden = false;
  }
  loadLibrary();
}

// ---- Detail panel ----
async function openPaper(id) {
  currentId = id;
  document.querySelectorAll("#library .item").forEach(el => el.classList.toggle("selected", +el.dataset.id === id));
  $("detail-placeholder").hidden = true;
  $("detail-view").hidden = false;
  $("summary").innerHTML = "";
  $("summary-status").textContent = "";
  $("answers").innerHTML = "";
  $("ask-status").textContent = "";
  $("question").value = "";
  $("detail-meta").innerHTML = spin("Loading...");
  try {
    const r = await fetch("/api/papers/" + id);
    const p = await r.json();
    if (!r.ok) throw new Error(p.detail || "Failed to load paper");
    if (id !== currentId) return;
    $("detail-meta").innerHTML = `
      <h3>${esc(p.title)}</h3>
      <div class="meta">${esc(p.authors)}${p.year ? " &middot; " + esc(p.year) : ""}</div>
      ${abstractHtml(p.abstract)}
      ${p.url ? `<div class="row"><a href="${esc(p.url)}" target="_blank" rel="noopener">View on arXiv</a></div>` : ""}`;
    initAbstracts($("detail-meta"));
    if (p.summary) {
      $("summary").innerHTML = md(p.summary);
      $("summarize-btn").textContent = "Re-summarize";
    } else {
      $("summarize-btn").textContent = "Summarize";
    }
  } catch (e) {
    $("detail-meta").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

// Run an LLM request with a spinner on the button's status line; returns parsed JSON or null on error.
async function llmCall(btn, statusEl, loadingText, url, body) {
  btn.disabled = true;
  statusEl.className = "meta";
  statusEl.innerHTML = spin(loadingText);
  try {
    const r = await fetch(url, body ? {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
    } : {method: "POST"});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Request failed");
    statusEl.textContent = "";
    if (data.warning) { statusEl.className = "warn"; statusEl.textContent = data.warning; }
    return data;
  } catch (e) {
    statusEl.innerHTML = `<span class="err">${esc(e.message)}</span>`;
    return null;
  } finally {
    btn.disabled = false;
  }
}

$("summarize-btn").onclick = async () => {
  const id = currentId;
  const force = $("summarize-btn").textContent === "Re-summarize";
  $("summary").innerHTML = "";
  const data = await llmCall($("summarize-btn"), $("summary-status"),
    "Claude is reading the full paper (10-30 seconds)...",
    `/api/papers/${id}/summarize?force=${force}`);
  if (data && id === currentId) {
    $("summary").innerHTML = md(data.summary);
    $("summarize-btn").textContent = "Re-summarize";
  }
};

async function askQuestion() {
  const id = currentId, q = $("question").value.trim();
  if (!q) return;
  const data = await llmCall($("ask-btn"), $("ask-status"),
    "Claude is reading the paper...", `/api/papers/${id}/ask`, {question: q});
  if (data && id === currentId) {
    $("answers").insertAdjacentHTML("afterbegin",
      `<div class="qa"><div class="q">${esc(q)}</div><div class="md">${md(data.answer)}</div></div>`);
    $("question").value = "";
  }
}
$("ask-btn").onclick = askQuestion;
$("question").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) askQuestion(); });
</script>
</body>
</html>
